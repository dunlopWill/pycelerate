[project]
name = "pycelerate"
version = "0.1.0"
description = "Build Excel formulas with Python operators, for openpyxl"
readme = "README.md"
authors = [
    { name = "inkie", email = "willmdunlop@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []


[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
markers = [
    "slow: evaluates a workbook in headless LibreOffice; deselect with -m 'not slow'",
]
